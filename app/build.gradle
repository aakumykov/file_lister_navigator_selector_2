plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

android {
    namespace 'com.github.aakumykov.file_lister_navigator_selector_demo'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.github.aakumykov.file_lister_navigator_selector_demo"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        manifestPlaceholders = [YANDEX_CLIENT_ID:"ce5360b57d9d4ac59350e6729f6ad662"]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        viewBinding true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation project(':local')
    implementation project(':yandex_disk')
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit

    implementation 'com.github.aakumykov.cloud_authenticator:cloud_authenticator:0.0.12-alpha'
    implementation 'com.github.aakumykov.cloud_authenticator:yandex_authenticator:0.0.12-alpha'
}